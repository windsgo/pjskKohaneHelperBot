[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sekai-toolkit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "msgpack>=1,<2", "Pillow>=10", "aiohttp>=3.10,<4"]

[tool.setuptools.packages.find]
where = ["src"]
